name: Feature request
description: Propose a capability or improvement
labels: [enhancement]
body:
  - type: textarea
    id: problem
    attributes:
      label: Problem
      description: What are you trying to achieve, and why is it not possible today?
    validations:
      required: true
  - type: textarea
    id: proposal
    attributes:
      label: Proposal
      description: Include failure semantics, concurrency behaviour and security implications.
  - type: textarea
    id: alternatives
    attributes:
      label: Alternatives considered
