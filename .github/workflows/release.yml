name: Release

# Publishes to Maven Central only from an intentional version tag such as v1.2.3.
# See docs/release-process.md for prerequisites, required secrets and recovery steps.
on:
  push:
    tags: ['v[0-9]+.[0-9]+.[0-9]+']

permissions:
  contents: read

# Never run two releases at once and never cancel a release in progress.
concurrency:
  group: release
  cancel-in-progress: false

env:
  MAVEN_ARGS: -B -ntp

jobs:
  verify:
    name: Verify release candidate
    runs-on: ubuntu-24.04
    timeout-minutes: 60
    outputs:
      version: ${{ steps.version.outputs.version }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-java@77dd5b2ce225ea11469928ac317850245a74ae78 # v6.2.0
        with:
          distribution: temurin
          java-version: '21'
          cache: maven
      - name: Check tag, project version and changelog
        id: version
        env:
          TAG: ${{ github.ref_name }}
        run: |
          version="$(./mvnw -q -N org.apache.maven.plugins:maven-help-plugin:3.5.2:evaluate \
            -Dexpression=project.version -DforceStdout)"
          if [ "v${version}" != "${TAG}" ]; then
            echo "::error::Tag ${TAG} does not match project version ${version}"; exit 1
          fi
          case "${version}" in *-SNAPSHOT) echo "::error::Refusing to release a SNAPSHOT"; exit 1;; esac
          if ! grep -q "^## \[${version}\]" CHANGELOG.md; then
            echo "::error::CHANGELOG.md has no '## [${version}]' section"; exit 1
          fi
          echo "version=${version}" >> "$GITHUB_OUTPUT"
      - name: Refuse to overwrite a published version
        env:
          VERSION: ${{ steps.version.outputs.version }}
        run: |
          url="https://repo.maven.apache.org/maven2/io/github/tanmaysinghx/zynqo-core/${VERSION}/zynqo-core-${VERSION}.pom"
          status="$(curl -s -o /dev/null -w '%{http_code}' "$url")"
          if [ "$status" = "200" ]; then
            echo "::error::zynqo-core ${VERSION} already exists on Maven Central"; exit 1
          fi
      - name: Quality gates (tests, integration tests, coverage, static analysis)
        run: ./mvnw -Pstatic-analysis verify
      - name: Upload test reports
        if: ${{ !cancelled() }}
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: release-test-reports
          path: |
            **/target/surefire-reports/
            **/target/failsafe-reports/
          retention-days: 90

  publish:
    name: Sign and publish to Maven Central
    needs: verify
    runs-on: ubuntu-24.04
    timeout-minutes: 90
    # Protect this environment with required reviewers so every publication is approved.
    environment: maven-central
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-java@77dd5b2ce225ea11469928ac317850245a74ae78 # v6.2.0
        with:
          distribution: temurin
          java-version: '21'
          cache: maven
          # Writes ~/.m2/settings.xml with a 'central' server whose credentials are read from the
          # environment variables below at build time; the values are never written to disk.
          server-id: central
          server-username: CENTRAL_TOKEN_USERNAME
          server-password: CENTRAL_TOKEN_PASSWORD
      - name: Build, sign, upload and wait until PUBLISHED
        env:
          CENTRAL_TOKEN_USERNAME: ${{ secrets.CENTRAL_TOKEN_USERNAME }}
          CENTRAL_TOKEN_PASSWORD: ${{ secrets.CENTRAL_TOKEN_PASSWORD }}
          MAVEN_GPG_KEY: ${{ secrets.MAVEN_GPG_KEY }}
          MAVEN_GPG_PASSPHRASE: ${{ secrets.MAVEN_GPG_PASSPHRASE }}
        run: ./mvnw -Prelease deploy -DskipTests 2>&1 | tee publish.log
        shell: bash
      - name: Validate published bundle
        env:
          VERSION: ${{ needs.verify.outputs.version }}
        run: python3 scripts/validate-central-bundle.py target/central-publishing/central-bundle.zip "$VERSION"
      - name: Preserve publishing evidence
        if: ${{ always() }}
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: publishing-evidence
          path: |
            publish.log
            target/central-publishing/central-bundle.zip
          retention-days: 90
          if-no-files-found: warn

  github-release:
    name: Create GitHub Release
    # Runs only after Central reported the deployment as PUBLISHED.
    needs: [verify, publish]
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Extract release notes from CHANGELOG.md
        env:
          VERSION: ${{ needs.verify.outputs.version }}
        run: |
          awk -v v="## [${VERSION}]" '
            index($0, v) == 1 { found = 1; next }
            found && /^## \[/ { exit }
            found { print }
          ' CHANGELOG.md > release-notes.md
          {
            echo
            echo "Maven Central: https://central.sonatype.com/artifact/io.github.tanmaysinghx/zynqo-spring-boot-starter/${VERSION}"
            echo
            echo "Central may take some time to index a new release and make it available in search and in all mirrors."
          } >> release-notes.md
      - name: Create release
        env:
          GH_TOKEN: ${{ github.token }}
          TAG: ${{ github.ref_name }}
        run: gh release create "$TAG" --repo "$GITHUB_REPOSITORY" --title "Zynqo ${TAG#v}" --notes-file release-notes.md --verify-tag
