# Local Redis for the example application.
#   docker compose up -d
#   DEMO_PASSWORD=change-me ../../mvnw spring-boot:run
services:
  redis:
    image: redis:8.0-alpine
    # Append-only persistence so completed idempotency records survive a Redis restart.
    command: ["redis-server", "--appendonly", "yes"]
    ports:
      - "127.0.0.1:6379:6379"
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 3s
      retries: 10
